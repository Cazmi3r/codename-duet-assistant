# Publishes the site whenever main changes: run the tests, then copy public/
# to the server. Needs three repository secrets:
#   DEPLOY_SSH_KEY      private key the server accepts for the deploy account
#   DEPLOY_HOST         server address
#   DEPLOY_KNOWN_HOSTS  the server's known_hosts line, to verify its identity
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Finish one deploy before starting the next.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Copy site to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server limits this key to rsync into the site folder, so the
          # destination path is relative to that folder.
          rsync -rltv --delete -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" public/ "deploy@$DEPLOY_HOST:./"
